name: Recurring Trigger

on:
  schedule:
    # 매일 오전 9시 (UTC 00:00) 실행
    - cron: '0 0 * * *'
  workflow_dispatch: # 수동 실행 가능

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Call recurring-trigger Edge Function
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail

          BASE_URL="${SUPABASE_URL:-${VITE_SUPABASE_URL:-}}"
          ANON_KEY="${SUPABASE_ANON_KEY:-${VITE_SUPABASE_ANON_KEY:-}}"
          if [[ -z "$BASE_URL" ]]; then
            echo "::error::Missing secret: SUPABASE_URL (or fallback VITE_SUPABASE_URL)"
            exit 1
          fi

          if [[ -z "$ANON_KEY" ]]; then
            echo "::error::Missing secret: SUPABASE_ANON_KEY (or fallback VITE_SUPABASE_ANON_KEY)"
            exit 1
          fi

          if [[ -z "${CRON_SECRET:-}" ]]; then
            echo "::error::Missing secret: CRON_SECRET"
            exit 1
          fi

          RESPONSE_FILE="$(mktemp)"
          HTTP_CODE="$(curl -sS -o "$RESPONSE_FILE" -w "%{http_code}" \
            -X POST "${BASE_URL%/}/functions/v1/recurring-trigger" \
            -H "Authorization: Bearer $ANON_KEY" \
            -H "apikey: $ANON_KEY" \
            -H "x-cron-secret: $CRON_SECRET" \
            -H "Content-Type: application/json")"

          echo "HTTP status: $HTTP_CODE"
          if [[ ! "$HTTP_CODE" =~ ^2 ]]; then
            echo "::error::Edge Function call failed"
            echo "Response body:"
            cat "$RESPONSE_FILE"
            exit 1
          fi

          echo "Edge Function call succeeded"
          echo "Response body:"
          cat "$RESPONSE_FILE"
